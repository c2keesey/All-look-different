<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllLookDifferent? - European Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-text"><span class="bold">ALL</span>LOOK<span class="bold">DIFFERENT</span><span class="bold">?</span></span>
            </div>
            <p class="tagline">Examination of European Experience</p>
        </header>

        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <div class="exam-room-header">
                <h2>Exam Room</h2>
            </div>
            <div class="quiz-category">
                <div class="category-image">
                    <img src="https://ui-avatars.com/api/?name=EU&background=ddd&size=150&font-size=0.4" alt="Faces">
                </div>
                <div class="category-info">
                    <h3>Faces</h3>
                    <p>These are photos of Europeans. The people who appear in these pictures are 100% British, German or French; nobody is mixed.</p>
                    <button id="start-btn" class="start-btn">Start Exam</button>
                </div>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="photo-frame">
                <img id="person-photo" src="" alt="Person photo">
            </div>

            <div class="options">
                <button class="option-btn" data-answer="british">
                    <span class="letter">B</span>
                    <span class="label">British</span>
                </button>
                <button class="option-btn" data-answer="german">
                    <span class="letter">G</span>
                    <span class="label">German</span>
                </button>
                <button class="option-btn" data-answer="french">
                    <span class="letter">F</span>
                    <span class="label">French</span>
                </button>
            </div>

            <div class="progress-section">
                <span id="progress-number">1</span>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <div class="exam-room-header">
                <h2>Results</h2>
            </div>
            <div class="results-content">
                <div class="score-display">
                    <span id="score">0</span> / 18
                </div>
                <p id="score-message"></p>
                <div id="results-breakdown" class="results-breakdown">
                    <!-- Results will be populated here -->
                </div>
                <button id="retry-btn" class="start-btn">Try Again</button>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
